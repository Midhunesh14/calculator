apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-probe-demo
  namespace: default
  labels:
    app: calculator-web
    demo: readiness-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-web
      demo: readiness-probe
  template:
    metadata:
      labels:
        app: calculator-web
        demo: readiness-probe
    spec:
      containers:
        - name: calculator-web
          image: midhunesh/calculator-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
