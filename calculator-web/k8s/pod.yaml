apiVersion: v1
kind: Pod
metadata:
  name: calculator-web-pod
  namespace: default
  labels:
    app: calculator-web
    tier: frontend
    lab: standalone-pod
spec:
  containers:
    - name: calculator-web
      image: calculator-web:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          name: http
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
  terminationGracePeriodSeconds: 30
