apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-web
  namespace: default
  labels:
    app: calculator-web
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-web
      tier: frontend
  template:
    metadata:
      labels:
        app: calculator-web
        tier: frontend
    spec:
      containers:
        - name: calculator-web
          image: midhunesh/calculator-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
