apiVersion: v1
kind: Service
metadata:
  name: calculator-web-service
  namespace: default
  labels:
    app: calculator-web
    tier: frontend
spec:
  type: NodePort
  selector:
    app: calculator-web
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
